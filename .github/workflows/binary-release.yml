name: Native binary release

concurrency:
  group: native-binary-release-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'prepare generates unsigned approval materials; publish requires a reviewed prepare run and exact approval SHA-256'
        required: true
        type: choice
        options:
          - prepare
          - publish
      version:
        description: 'MAJOR.MINOR.PATCH; must match Cargo workspace and v tag'
        required: true
        type: string
      source_commit:
        description: 'Full main commit SHA approved for this release'
        required: true
        type: string
      prepare_run_id:
        description: 'Required only in publish mode; completed prepare run ID'
        required: false
        type: string
      approval_record_sha256:
        description: 'Required only in publish mode; SHA-256 reviewed and approved by the maintainer'
        required: false
        type: string

jobs:
  build:
    if: inputs.mode == 'prepare' && github.ref == 'refs/heads/main'
    name: Build unsigned stable assets for review
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.validate.outputs.source_commit }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      checks: read
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: 'true'
      BUILDER_IMAGE: tgm-native-builder:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate exact main source and successful required checks
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          main_commit="$(git rev-parse origin/main^{commit})"
          test "$SOURCE_COMMIT" = "$GITHUB_SHA"
          test "$SOURCE_COMMIT" = "$main_commit"
          test -z "$(git status --porcelain)"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          checks="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SOURCE_COMMIT/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name == "static" or .name == "database") | [.name,.status,.conclusion] | @tsv')"
          for required in static database; do
            matches="$(printf '%s\n' "$checks" | awk -F '\t' -v name="$required" '$1 == name { count++ } END { print count + 0 }')"
            result="$(printf '%s\n' "$checks" | awk -F '\t' -v name="$required" '$1 == name { print $2 "\t" $3 }')"
            if [ "$matches" != 1 ] || [ "$result" != $'completed\tsuccess' ]; then
              echo "main commit check $required must be unique and successful" >&2
              printf '%s\n' "$checks" >&2
              exit 1
            fi
          done

      - name: Install Rust toolchain
        id: toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          echo "version=$(rustup show active-toolchain | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Resolve and validate stable version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          workspace_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tgm") | .version')"
          test "$workspace_version" = "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create exact source archive and builder
        env:
          SOURCE_COMMIT: ${{ steps.validate.outputs.source_commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "$SOURCE_COMMIT")"
          source_context="$RUNNER_TEMP/tgm-release-source-$GITHUB_RUN_ID"
          mkdir -p dist/assets "$source_context"
          python3 scripts/stable-source-archive.py \
            --repository "$GITHUB_WORKSPACE" --commit "$SOURCE_COMMIT" \
            --manifest-path scripts/stable-source-archive.manifest \
            --source-date-epoch "$epoch" \
            --output "dist/assets/tgm-${VERSION}-source.tar.gz"
          tar -xzf "dist/assets/tgm-${VERSION}-source.tar.gz" -C "$source_context" --strip-components=1
          echo "TGM_SOURCE_CONTEXT=$source_context" >> "$GITHUB_ENV"
          docker build --pull=false --file "$source_context/deploy/native/centos7-builder.Dockerfile" \
            --tag "$BUILDER_IMAGE" "$source_context"

      - name: Build and inspect native binary
        id: build
        run: |
          set -euo pipefail
          container="$(docker create "$BUILDER_IMAGE")"
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p dist
          docker cp "$container:/src/target/release/tgm" dist/tgm
          docker image inspect --format '{{.Id}}' "$BUILDER_IMAGE" > dist/builder-image.id
          echo "builder_image_id=$(cat dist/builder-image.id)" >> "$GITHUB_OUTPUT"
          chmod 0755 dist/tgm
          python3 - <<'PY'
          import re
          import subprocess
          output = subprocess.check_output(['readelf', '--version-info', 'dist/tgm'], text=True)
          versions = [tuple(map(int, value.split('.'))) for value in re.findall(r'GLIBC_([0-9]+(?:\.[0-9]+)*)', output)]
          if max(versions, default=(0,)) > (2, 17):
              raise SystemExit('binary requires glibc newer than 2.17')
          PY
          ldd dist/tgm
          ./dist/tgm --help >/dev/null
          ./dist/tgm purge-deleted-tenants --help >/dev/null
          "$TGM_SOURCE_CONTEXT/scripts/native-release-preflight.sh" --binary dist/tgm --unit-dir "$TGM_SOURCE_CONTEXT/deploy/systemd"
          "$TGM_SOURCE_CONTEXT/scripts/native-release-preflight.sh" --binary dist/tgm --unit-dir "$TGM_SOURCE_CONTEXT/deploy/systemd" --app-services

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ env.TGM_SOURCE_CONTEXT }}
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-artifact: false

      - name: Package deterministic binary archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_COMMIT: ${{ steps.validate.outputs.source_commit }}
          BUILDER_IMAGE_ID: ${{ steps.build.outputs.builder_image_id }}
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "$SOURCE_COMMIT")"
          python3 "$TGM_SOURCE_CONTEXT/scripts/native-release-package.py" \
            --source-root "$TGM_SOURCE_CONTEXT" --binary "$GITHUB_WORKSPACE/dist/tgm" \
            --sbom "$GITHUB_WORKSPACE/dist/sbom.cdx.json" --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" --rust-toolchain "$(rustup show active-toolchain | awk '{print $1}')" \
            --builder-image "$BUILDER_IMAGE_ID" --source-date-epoch "$epoch" \
            --source-manifest-sha256 "$(sha256sum "$TGM_SOURCE_CONTEXT/scripts/stable-source-archive.manifest" | awk '{print $1}')" \
            --output "$GITHUB_WORKSPACE/dist/package"
          cp "dist/package/tgm-${VERSION}-linux-x86_64-gnu.tar.gz" dist/assets/
          cp dist/package/BUILDINFO.json dist/package/sbom.cdx.json dist/assets/
          cp "$TGM_SOURCE_CONTEXT/scripts/stable-source-archive.manifest" dist/assets/SOURCE-ARCHIVE-MANIFEST.txt
          manifest_sha="$(sha256sum dist/assets/SOURCE-ARCHIVE-MANIFEST.txt | awk '{print $1}')"
          python3 scripts/stable-release-assets.py prepare \
            --assets dist/assets --version "$VERSION" --source-commit "$SOURCE_COMMIT" \
            --builder-image "$BUILDER_IMAGE_ID" --rust-toolchain "$(rustup show active-toolchain | awk '{print $1}')" \
            --run-id "$GITHUB_RUN_ID" --source-manifest-sha256 "$manifest_sha"

      - name: Rebuild package only from the source archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_COMMIT: ${{ steps.validate.outputs.source_commit }}
          TOOLCHAIN: ${{ steps.toolchain.outputs.version }}
          BUILDER_IMAGE_ID: ${{ steps.build.outputs.builder_image_id }}
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "$SOURCE_COMMIT")"
          python3 scripts/check-stable-source-rebuild.py \
            --source-archive "dist/assets/tgm-${VERSION}-source.tar.gz" --sbom dist/assets/sbom.cdx.json \
            --version "$VERSION" --source-commit "$SOURCE_COMMIT" --rust-toolchain "$TOOLCHAIN" \
            --builder-image "$BUILDER_IMAGE_ID" --source-date-epoch "$epoch" \
            --expected-binary dist/tgm --expected-package "dist/assets/tgm-${VERSION}-linux-x86_64-gnu.tar.gz"

      - name: Prepare unsigned release approval record
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_COMMIT: ${{ steps.validate.outputs.source_commit }}
        run: |
          set -euo pipefail
          python3 scripts/stable-release-assets.py verify \
            --assets dist/assets --version "$VERSION" --source-commit "$SOURCE_COMMIT" \
            --expected-run-id "$GITHUB_RUN_ID"
          python3 scripts/stable-release-approval.py prepare \
            --assets dist/assets --version "$VERSION" --source-commit "$SOURCE_COMMIT" \
            --prepare-run-id "$GITHUB_RUN_ID" \
            --output dist/approval/APPROVAL.json
          (cd dist/approval && sha256sum APPROVAL.json > APPROVAL.json.sha256)
          cat dist/approval/APPROVAL.json
          cat dist/approval/APPROVAL.json.sha256

      - name: Upload unsigned approval materials
        uses: actions/upload-artifact@v6
        with:
          name: stable-release-approval-v${{ steps.version.outputs.version }}-run-${{ github.run_id }}
          path: |
            dist/assets/
            dist/approval/
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup builder resources
        if: always()
        run: |
          docker rm -f $(docker ps -aq --filter "ancestor=$BUILDER_IMAGE") 2>/dev/null || true
          docker image rm "$BUILDER_IMAGE" 2>/dev/null || true

  publish:
    if: ${{ always() && inputs.mode == 'publish' && github.actor == 'WTFGEDelphia' && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'skipped' }}
    name: Sign and publish maintainer-approved stable Release
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download approved prepare artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prepare_run_id }}
          name: stable-release-approval-v${{ inputs.version }}-run-${{ inputs.prepare_run_id }}
          path: dist/prepared

      - name: Separate approved record from release payload
        run: |
          set -euo pipefail
          test -d dist/prepared/assets
          test -d dist/prepared/approval
          mkdir -p dist/assets dist/approval
          cp -a dist/prepared/assets/. dist/assets/
          cp -a dist/prepared/approval/. dist/approval/

      - name: Verify prepare run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARE_RUN_ID")"
          jq -e --arg sha "$SOURCE_COMMIT" \
            '.name == "Native binary release" and .path == ".github/workflows/binary-release.yml" and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_branch == "main" and .head_sha == $sha' \
            <<< "$run" >/dev/null

      - name: Recheck explicit approval material
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          APPROVAL_RECORD_SHA256: ${{ inputs.approval_record_sha256 }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREPARE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVAL_RECORD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "${GITHUB_REF_NAME#v}" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          checks="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SOURCE_COMMIT/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name == "static" or .name == "database") | [.name,.status,.conclusion] | @tsv')"
          for required in static database; do
            count="$(printf '%s\n' "$checks" | awk -F '\t' -v name="$required" '$1 == name { n++ } END { print n + 0 }')"
            result="$(printf '%s\n' "$checks" | awk -F '\t' -v name="$required" '$1 == name { print $2 "\t" $3 }')"
            test "$count" = 1 && test "$result" = $'completed\tsuccess'
          done
          python3 scripts/stable-release-approval.py verify \
            --assets dist/assets --record dist/approval/APPROVAL.json \
            --record-sha256 "$APPROVAL_RECORD_SHA256" --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" --prepare-run-id "$PREPARE_RUN_ID"

      - name: Reject existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/release-lookup-$GITHUB_RUN_ID.txt"
          if gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >"$response" 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)' "$response" || {
            cat "$response" >&2
            echo "Release lookup failed; refusing to publish." >&2
            exit 1
          }

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign, verify, and publish approved assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVAL_RECORD_SHA256: ${{ inputs.approval_record_sha256 }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          APPROVER: ${{ github.actor }}
          APPROVAL_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/assets/SHA256SUMS.sigstore.json dist/assets/SHA256SUMS
          cosign sign-blob --yes --bundle dist/assets/provenance.sigstore.json dist/assets/provenance.json
          python3 scripts/stable-release-assets.py verify \
            --assets dist/assets --version "$VERSION" --source-commit "$SOURCE_COMMIT" \
            --expected-run-id "$PREPARE_RUN_ID" --verify-signatures
          approval_bundle="$RUNNER_TEMP/approval-statement.json"
          python3 scripts/stable-release-approval.py approve \
            --assets dist/assets --record dist/approval/APPROVAL.json \
            --record-sha256 "$APPROVAL_RECORD_SHA256" --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" --prepare-run-id "$PREPARE_RUN_ID" \
            --approval-run-id "$APPROVAL_RUN_ID" --approver "$APPROVER" \
            --output "$approval_bundle"
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/approval.sigstore.json" "$approval_bundle"
          approval_identity="https://github[.]com/wtfdelphia/tg-monitor-bot/.github/workflows/binary-release[.]yml@refs/tags/v${VERSION//./[.]}"
          cosign verify-blob --bundle "$RUNNER_TEMP/approval.sigstore.json" \
            --certificate-identity-regexp "$approval_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$approval_bundle"
          remote_tag="$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          remote_commit="$(awk -v direct="refs/tags/$RELEASE_TAG" -v peeled="refs/tags/$RELEASE_TAG^{}" \
            '$2 == direct { tag=$1 } $2 == peeled { commit=$1 } END { print commit != "" ? commit : tag }' <<< "$remote_tag")"
          test "$remote_commit" = "$SOURCE_COMMIT" || {
            echo "release tag no longer resolves to the approved source commit" >&2
            exit 1
          }
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --generate-notes dist/assets/* \
            dist/approval/APPROVAL.json dist/approval/APPROVAL.json.sha256 \
            "$approval_bundle" "$RUNNER_TEMP/approval.sigstore.json"

      - name: Verify published approval record signature
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          APPROVAL_RECORD_SHA256: ${{ inputs.approval_record_sha256 }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          approval_identity="https://github[.]com/wtfdelphia/tg-monitor-bot/.github/workflows/binary-release[.]yml@refs/tags/v${VERSION//./[.]}"
          approved="$RUNNER_TEMP/approved-release"
          mkdir -p "$approved"
          gh release download "$RELEASE_TAG" \
            --pattern APPROVAL.json --pattern APPROVAL.json.sha256 \
            --pattern approval-statement.json --pattern approval.sigstore.json \
            --dir "$approved"
          cmp -- dist/approval/APPROVAL.json "$approved/APPROVAL.json"
          cmp -- dist/approval/APPROVAL.json.sha256 "$approved/APPROVAL.json.sha256"
          (cd "$approved" && sha256sum -c APPROVAL.json.sha256)
          cmp -- "$RUNNER_TEMP/approval-statement.json" "$approved/approval-statement.json"
          cosign verify-blob --bundle "$approved/approval.sigstore.json" \
            --certificate-identity-regexp "$approval_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$approved/approval-statement.json"
